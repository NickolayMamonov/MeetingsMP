name: Quality Checks

# Объективный гейт качества для PR.
# Блокирующие проверки: build + test + detekt.
# Неблокирующие (информационные): Android lint.
# Для блокировки мержа добавьте job `detekt` в required status checks (Settings → Rules).

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Unit Tests (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # JVM-таргет в конвенциях объявлен как jvm("desktop") → тест-таск desktopTest.
      # iOS (compileKotlinIosX64 и т.п.) собирается только на macOS — здесь не запускаем.
      - name: Desktop (JVM) unit tests
        run: ./gradlew desktopTest --stacktrace

      - name: Android unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble Android (debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore

      - name: Upload Gradle problems report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-problems-report
          path: build/reports/problems
          if-no-files-found: ignore

  detekt:
    name: Detekt (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Для блокировки мержа добавьте job `detekt` в required status checks (Settings → Rules).
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Run detekt
        run: ./gradlew detekt --stacktrace

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: "**/build/reports/detekt/**"
          if-no-files-found: ignore

  android-lint:
    name: Android Lint (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: "**/build/reports/lint-results-debug.*"
          if-no-files-found: ignore
