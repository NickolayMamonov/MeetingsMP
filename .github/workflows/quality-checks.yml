name: Quality Checks

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build-and-test:
    name: Build & Unit Tests (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Desktop (JVM) unit tests
        run: ./gradlew desktopTest --stacktrace

      - name: Android unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble Android (debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore

      - name: Upload Gradle problems report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-problems-report
          path: build/reports/problems
          if-no-files-found: ignore

  detekt:
    name: Detekt (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Run detekt
        run: ./gradlew detekt --stacktrace

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: "**/build/reports/detekt/**"
          if-no-files-found: ignore

  android-lint:
    name: Android Lint (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: "**/build/reports/lint-results-debug.*"
          if-no-files-found: ignore

  pr-comment:
    name: PR Summary Comment
    if: github.event_name == 'pull_request'
    needs: [build-and-test, detekt, android-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post results comment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const prNumber = context.payload.pull_request.number

            const buildResult = "${{ needs.build-and-test.result }}"
            const detektResult = "${{ needs.detekt.result }}"
            const lintResult = "${{ needs.android-lint.result }}"

            const statusIcon = (r) => r === "success" ? "✅" : r === "skipped" ? "⏭️" : "❌"

            const body = `## Quality Gates Report

| Gate | Status |
|------|--------|
| Build & Unit Tests | ${statusIcon(buildResult)} ${buildResult} |
| Detekt | ${statusIcon(detektResult)} ${detektResult} |
| Android Lint | ${statusIcon(lintResult)} ${lintResult} |

${buildResult === "failure" ? "### Build failed
Check the logs for details." : ""}
${detektResult === "failure" ? "### Detekt issues found
Run \`./gradlew detekt\` locally and fix violations." : ""}
`

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body,
            })
